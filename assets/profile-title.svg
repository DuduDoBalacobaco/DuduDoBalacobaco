<svg width="900" height="180" viewBox="0 0 900 180"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Glow principal -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow mais suave para ornamentos -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Gradiente azul -->
    <linearGradient id="moonGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#4C789B"/>
      <stop offset="50%" stop-color="#B9E6FF"/>
      <stop offset="100%" stop-color="#4C789B"/>
    </linearGradient>
  </defs>


  <!-- ====================================================== -->
  <!-- ORNAMENTO SUPERIOR -->
  <!-- ====================================================== -->

  <g stroke="url(#moonGradient)"
     fill="none"
     stroke-width="1.4"
     opacity="0.9">

    <!-- Linha esquerda -->
    <path d="
      M100 48
      C180 48 205 48 265 48
      C290 48 300 38 315 30
    "/>

    <!-- Linha direita -->
    <path d="
      M800 48
      C720 48 695 48 635 48
      C610 48 600 38 585 30
    "/>

    <!-- Detalhes -->
    <path d="M180 48 L195 40 L210 48 L195 56 Z"/>
    <path d="M720 48 L705 40 L690 48 L705 56 Z"/>

  </g>


  <!-- ====================================================== -->
  <!-- LUA -->
  <!-- ====================================================== -->

  <g filter="url(#glow)">

    <circle
      cx="450"
      cy="29"
      r="17"
      fill="none"
      stroke="#9DDCFF"
      stroke-width="1.5"
      opacity="0.9"/>

    <!-- Lua crescente -->
    <circle
      cx="456"
      cy="25"
      r="15"
      fill="#0D1117"/>

  </g>


  <!-- ====================================================== -->
  <!-- ESTRELAS -->
  <!-- ====================================================== -->

  <g fill="#B9E6FF">

    <circle cx="335" cy="28" r="1.5"/>
    <circle cx="365" cy="42" r="1"/>
    <circle cx="535" cy="42" r="1"/>
    <circle cx="565" cy="28" r="1.5"/>

    <path d="
      M305 36
      L308 39
      L305 42
      L302 39
      Z
    "/>

    <path d="
      M595 36
      L598 39
      L595 42
      L592 39
      Z
    "/>

  </g>


  <!-- ====================================================== -->
  <!-- NOME -->
  <!-- ====================================================== -->

  <text
    x="450"
    y="100"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="39"
    font-weight="600"
    letter-spacing="2"
    fill="#B9E6FF"
    filter="url(#glow)">
    DuduDoBalacobaco
  </text>


  <!-- ====================================================== -->
  <!-- SUBTÍTULO -->
  <!-- ====================================================== -->

  <text
    x="450"
    y="137"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="19"
    letter-spacing="1.5"
    fill="#78B9DF">
    Backend Developer  •  Java  •  Spring Boot
  </text>


  <!-- ====================================================== -->
  <!-- ORNAMENTO INFERIOR -->
  <!-- ====================================================== -->

  <g
    stroke="url(#moonGradient)"
    fill="none"
    stroke-width="1.2"
    opacity="0.75">

    <path d="
      M175 158
      L360 158
      L380 151
      L400 158
      L450 158
    "/>

    <path d="
      M725 158
      L540 158
      L520 151
      L500 158
      L450 158
    "/>

    <!-- Diamante central -->
    <path d="
      M450 153
      L455 158
      L450 163
      L445 158
      Z
    "/>

  </g>

</svg>