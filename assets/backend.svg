<svg width="500" height="55" viewBox="0 0 500 55"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#355f88"/>
      <stop offset="35%" stop-color="#7ddcff"/>
      <stop offset="50%" stop-color="#d2f4ff"/>
      <stop offset="65%" stop-color="#7ddcff"/>
      <stop offset="100%" stop-color="#355f88"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Esquerda -->
  <path
    d="M40 28
       H145
       L160 19
       L170 28
       L160 37
       L145 28"
    fill="none"
    stroke="url(#ice)"
    stroke-width="1.5"
    filter="url(#glow)"
  />

  <circle
    cx="40"
    cy="28"
    r="2.5"
    fill="#9eeaff"
    filter="url(#glow)"
  />

  <!-- BACKEND -->
  <text
    x="250"
    y="34"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="18"
    letter-spacing="4"
    fill="url(#ice)"
    filter="url(#glow)">
    BACKEND
  </text>

  <!-- Direita -->
  <path
    d="M460 28
       H355
       L340 19
       L330 28
       L340 37
       L355 28"
    fill="none"
    stroke="url(#ice)"
    stroke-width="1.5"
    filter="url(#glow)"
  />

  <circle
    cx="460"
    cy="28"
    r="2.5"
    fill="#9eeaff"
    filter="url(#glow)"
  />

</svg>